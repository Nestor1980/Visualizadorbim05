<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizador BIM IFC</title>
  <link rel="stylesheet" href="/src/styles/global.css" />
</head>
<body>
  <div id="container"></div>
  <div id="loading-screen">
    <div id="loading-spinner"></div>
    <div id="loading-text">Cargando visualizador…</div>
  </div>
  <script>
    // three/webgpu reads self.GPUShaderStage at module load time with no
    // safe fallback in browsers that lack WebGPU. Without this, importing
    // @thatopen/components-front throws "Cannot read properties of
    // undefined (reading 'VERTEX')" before the app ever starts.
    window.GPUShaderStage = window.GPUShaderStage || { VERTEX: 1, FRAGMENT: 2, COMPUTE: 4 };
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
