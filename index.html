<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizador BIM — Gobierno de Entre Ríos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --er-green:       #5AB244;
      --er-green-dark:  #3D8A2E;
      --er-green-light: #7AC85F;
      --er-navy:        #142846;
      --bim-ui_accent-base: var(--er-green);
      font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1e1a;
      font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
    }

    /* bim-grid ocupa toda la pantalla — sin topbar */
    bim-grid {
      position: fixed;
      inset: 0;
      z-index: 10;
    }

    bim-panel { position: relative; }

    bim-toolbar {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    }

    bim-view-cube { cursor: grab; }
    bim-view-cube:active { cursor: grabbing; }

    bim-panel, bim-panel-section, bim-toolbar, bim-toolbar-section,
    bim-button, bim-label, bim-checkbox, bim-number-input,
    bim-dropdown, bim-table, bim-table-row, bim-color-input {
      font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif !important;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
